version: "3.8"

services:
  # Backend Node.js servers
  backend:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/p2p
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - ALLOWED_ORIGINS=https://share.rumnnlg.com,http://localhost:3000
    ports:
      - "3000"
    depends_on:
      - redis
      - mongo
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching + Socket.IO adapter
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB for persistent storage
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DB: p2p
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy + load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:
    driver: local
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
